<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine Proposal</title>

<style>
    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #ffecf2;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    .container {
        text-align: center;
    }

    h1 {
        font-size: 40px;
        margin-bottom: 40px;
        color: #d6004c;
    }

    button {
        font-size: 20px;
        padding: 12px 30px;
        margin: 10px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
    }

    #yes {
        background: #ff2f68;
        color: white;
        transition: all 0.3s ease;
    }

    #no {
        background: #ccc;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Will you be my valentine?? 💝</h1>
    <button id="yes" onclick="alert('YAY!! 💖💖💖')">Yes</button>
    <button id="no">No</button>
</div>

<script>
let scale = 1;
const yesBtn = document.getElementById("yes");
const noBtn = document.getElementById("no");

noBtn.addEventListener("click", () => {
    scale += 0.4;

    yesBtn.style.transform = `scale(${scale})`;

    if (scale > 5) {
        yesBtn.style.position = "fixed";
        yesBtn.style.top = "0";
        yesBtn.style.left = "0";
        yesBtn.style.width = "100vw";
        yesBtn.style.height = "100vh";
        yesBtn.style.fontSize = "60px";
        yesBtn.innerText = "YES 💖💍";
    }
});
</script>

</body>
</html>
